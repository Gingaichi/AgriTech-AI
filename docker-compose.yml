version: '3.8'

services:
  agritech-ai:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_PATH=/app/data/db.sqlite3
      - COHERE_API_KEY=${COHERE_API_KEY}
      - PLANTID_API_KEY=${PLANTID_API_KEY}
    volumes:
      # Persist database
      - agritech_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  agritech_data:
    driver: local
