version: '3.8'

services:
  # Django AI Models Service
  ai-models:
    build:
      context: ./ai_models
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=ai_models.settings
      - PLANTID_API_KEY=${PLANTID_API_KEY}
    volumes:
      - agritech_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Node.js Backend Service  
  agritech-ai:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_PATH=/app/data/db.sqlite3
      - COHERE_API_KEY=${COHERE_API_KEY}
      - PLANTID_API_KEY=${PLANTID_API_KEY}
      - AI_MODELS_URL=http://ai-models:8000
    volumes:
      # Persist database
      - agritech_data:/app/data
    depends_on:
      - ai-models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  agritech_data:
    driver: local
