services:
  - type: web
    name: agritech-ai
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile.single
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_PATH
        value: /app/data/db.sqlite3
      - key: AI_MODELS_URL
        value: http://localhost:8000
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: COHERE_API_KEY
        sync: false  # Set this in Render dashboard
      - key: PLANTID_API_KEY
        sync: false  # Set this in Render dashboard
    disk:
      name: agritech-data
      mountPath: /app/data
      sizeGB: 1
    healthCheckPath: /api/health
