services:
  - type: web
    name: agritech-ai
    runtime: docker
    plan: starter
    region: oregon
    buildCommand: docker build -t agritech-ai .
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_PATH
        value: /app/data/db.sqlite3
      - key: COHERE_API_KEY
        sync: false  # Set this in Render dashboard
      - key: PLANTID_API_KEY
        sync: false  # Set this in Render dashboard
    disk:
      name: agritech-data
      mountPath: /app/data
      sizeGB: 1
    healthCheckPath: /api/health
